[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merlintools"
version = "0.1.dev0"
description = "Handle 4D-STEM data collected with a Merlin detector."
readme = "README.md"
authors = [
    { name = "Andrew Herzing", email = "andrew.herzing@nist.gov" }
]
license = { text = "GPL v3" }
keywords = ["STEM", "data analysis", "microscopy", "4D-STEM"]
requires-python = ">=3.12, <3.13"

dependencies = [
    "numpy",
    "hyperspy",
    "fpd",
    "tqdm",
    "pyxem",
    "py4dstem",
]

[tool.uv]
override-dependencies = [
    "numba>=0.59.0",
    "llvmlite>=0.42.0",
    "scikit-learn>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
